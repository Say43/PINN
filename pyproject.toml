[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-pde-attention"
version = "0.1.0"
description = "Preregistered pilot of PDE-structured mixing in PINNs"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "torch>=2.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
